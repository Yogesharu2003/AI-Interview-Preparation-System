<!DOCTYPE html>
<html>
<head>

<title>Uploaded Resumes</title>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
    margin:0;
}

h1{
    background:#0d47a1;
    color:white;
    padding:20px;
    margin:0;
    text-align:center;
}

table{
    width:95%;
    margin:30px auto;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

th{
    background:#2962ff;
    color:white;
}

tr:nth-child(even){
    background:#f2f2f2;
}

.back{
    text-align:center;
    margin:20px;
}

.back a{
    background:#2962ff;
    color:white;
    padding:10px 20px;
    text-decoration:none;
    border-radius:5px;
}

</style>

</head>

<body>

<h1>Uploaded Resumes</h1>

<table>

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Resume</th>
<th>Date</th>

</tr>

{% for resume in resumes %}

<tr>

<td>{{ resume.resume_id }}</td>

<td>{{ resume.fullname }}</td>

<td>{{ resume.email }}</td>

<td>{{ resume.resume_name }}</td>

<td>{{ resume.upload_date }}</td>

</tr>

{% endfor %}

</table>

<div class="back">

<a href="/admin_dashboard">← Back to Dashboard</a>

</div>

</body>
</html>
