<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            margin:0;
        }

        h1{
            text-align:center;
            color:#0d47a1;
            margin-top:30px;
        }

        .container{
            width:90%;
            margin:auto;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:20px;
            margin-top:40px;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 5px 10px rgba(0,0,0,.2);
        }

        .card h2{
            font-size:35px;
            color:#2962ff;
        }

        .card p{
            font-size:20px;
        }

    </style>

</head>

<body>

<h1>🤖 AI Interview Preparation System</h1>

<div class="container">

<div class="cards">

<div class="card">
<h2>{{ total_users }}</h2>
<p>Total Users</p>
</div>

<div class="card">
<h2>{{ total_resumes }}</h2>
<p>Total Resumes</p>
</div>

<div class="card">
<h2>{{ total_interviews }}</h2>
<p>Total Interviews</p>
</div>

<div class="card">
<h2>{{ avg_score }}%</h2>
<p>Average Score</p>
</div>

</div>

</div>

</body>
</html>
