<!DOCTYPE html>
<html>
<head>
    <title>Users</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f6f9;
            margin:0;
        }

        h1{
            background:#0d47a1;
            color:white;
            padding:20px;
            margin:0;
            text-align:center;
        }

        table{
            width:95%;
            margin:30px auto;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }

        th{
            background:#2962ff;
            color:white;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }

        .back{
            margin:20px;
            text-align:center;
        }

        .back a{
            background:#2962ff;
            color:white;
            padding:10px 20px;
            text-decoration:none;
            border-radius:5px;
        }

    </style>

</head>

<body>

<h1>Registered Users</h1>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Phone</th>
</tr>

{% for user in users %}

<tr>

<td>{{ user.user_id }}</td>

<td>{{ user.fullname }}</td>

<td>{{ user.email }}</td>

<td>{{ user.phone }}</td>

</tr>

{% endfor %}

</table>

<div class="back">

<a href="/admin_dashboard">← Back to Dashboard</a>

</div>

</body>
</html>
